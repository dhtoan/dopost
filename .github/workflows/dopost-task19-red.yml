name: dopost Task 19 Red Gate

on:
  push:
    branches:
      - codex/task19-vox-motion-e2e
    paths:
      - "bun.lock"
      - "tests/app/dopost/**"
      - "apps/server/cmd/openpost/dopost_*"
      - "apps/web/src/lib/dopost/**"
      - "apps/web/src/hooks.client.ts"
      - "tests/app/playwright.config.ts"
      - ".github/workflows/dopost-task19-red.yml"
  pull_request:
    paths:
      - "bun.lock"
      - "tests/app/dopost/**"
      - "apps/server/cmd/openpost/dopost_*"
      - "apps/web/src/lib/dopost/**"
      - "apps/web/src/hooks.client.ts"
      - "tests/app/playwright.config.ts"
      - ".github/workflows/dopost-task19-red.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-red:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache-dependency-path: apps/server/go.sum
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Run dev fixture generator contracts
        run: >-
          cd apps/server && go test -tags dev ./cmd/openpost
          -run 'TestDopost(E2EPlannerGeneratorIsOptInAndStructured|PlannerGeneratorUsesE2EFixtureWhenExplicitlyEnabled)'
          -count=1 -v
      - name: Build production web embed
        run: bun run build -- frontend
      - name: Run production fixture guard contract
        run: cd apps/server && go test ./cmd/openpost -run TestDopostE2EPlannerGeneratorIsUnavailableInProduction -count=1 -v
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      # The browser gates need the E2E embed, not the production one above.
      # Build it and the dev server here, outside Playwright's five-minute
      # webServer window.
      - name: Build E2E web embed
        timeout-minutes: 15
        run: VITE_DOPOST_E2E=1 bun run build -- frontend
      - name: Prebuild dev server
        timeout-minutes: 10
        run: cd apps/server && go build -tags dev -o /dev/null ./cmd/openpost
      - name: Run Task 19 browser gates
        env:
          OPENPOST_E2E_PREBUILT: "1"
        run: >-
          bunx playwright test --config tests/app/playwright.config.ts
          tests/app/dopost/motion-determinism.spec.ts
          tests/app/dopost/motion-visual-qa.spec.ts
          tests/app/dopost/vox-documentary.spec.ts
          --workers=1
